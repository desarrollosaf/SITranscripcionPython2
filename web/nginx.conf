server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API (servicio "api" del compose) vive detrás de /api/: el
    # navegador solo habla con este origen, sin CORS.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Corregir estilo / numerar el orden del día con IA tardan minutos.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        # Audio por rangos: que nginx no lo bufferice completo.
        proxy_buffering off;
        client_max_body_size 50m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;
}
