@if (toastService.toasts().length) {
  <div class="toast-stack" role="status" aria-live="polite">
    @for (toast of toastService.toasts(); track toast.id) {
      <div class="toast" [attr.data-tipo]="toast.tipo">
        <span class="toast__icon" aria-hidden="true">
          @switch (toast.tipo) {
            @case ('success') {
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            }
            @case ('error') {
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                <path d="M12 8v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="12" cy="16" r="1" fill="currentColor"/>
              </svg>
            }
            @default {
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                <path d="M12 11v5M12 8v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            }
          }
        </span>
        <span class="toast__mensaje">{{ toast.mensaje }}</span>
        <button type="button" class="toast__cerrar" (click)="toastService.dismiss(toast.id)" aria-label="Cerrar aviso">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    }
  </div>
}
