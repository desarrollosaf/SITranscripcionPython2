<main class="stage">
  <div class="card" role="region" aria-labelledby="login-title">
    <img class="card__logo" src="assets/congreso-edomex-logo.png" alt="Congreso del Estado de México" />
    <span class="card__wordmark">SITranscripción</span>

    <h1 id="login-title">Iniciar sesión</h1>
    <p class="card__subtitle">Transcripción y versión estenográfica de sesiones</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="field__label">Email</span>
        <span class="field__control">
          <svg class="field__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M3.5 6.5 12 12l8.5-5.5M4.5 6h15A1.5 1.5 0 0 1 21 7.5v9A1.5 1.5 0 0 1 19.5 18h-15A1.5 1.5 0 0 1 3 16.5v-9A1.5 1.5 0 0 1 4.5 6Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="username"
            placeholder="usuario@congreso.local"
            spellcheck="false"
          />
        </span>
      </label>

      <label class="field">
        <span class="field__label">Contraseña</span>
        <span class="field__control">
          <svg class="field__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="5" y="10.5" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button
            type="button"
            class="field__toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M3 3l18 18M10.6 10.7a2.5 2.5 0 0 0 3.5 3.4M7.4 7.5C5.3 8.9 3.7 10.9 3 12c1.6 2.9 5 7 9 7 1.5 0 2.9-.4 4.1-1.1M16.8 16.9C18.7 15.5 20.2 13.6 21 12c-1.7-3-5-7-9-7-.9 0-1.7.1-2.5.4"
                      stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M3 12c1.7-3 5-7 9-7s7.3 4 9 7c-1.7 3-5 7-9 7s-7.3-4-9-7Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            }
          </button>
        </span>
      </label>

      <button type="submit" class="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Verificando…</span>
        } @else {
          <span>Entrar</span>
        }
      </button>
    </form>
  </div>

  <p class="stage__footer">© 2026 Poder Legislativo del Estado de México · SITranscripción</p>
</main>
